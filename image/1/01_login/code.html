<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | API Pulse</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                "on-secondary": "#ffffff",
                "tertiary-fixed-dim": "#2fd9f4",

                "surface-container-lowest": "#ffffff",

                "primary": "#005c55",

                "secondary": "#006b5f",
                "surface-bright": "#f8f9ff",
                "on-primary": "#ffffff",
                "secondary-container": "#6df5e1",
                "on-surface-variant": "#3e4947",
                "error": "#ba1a1a",
                "primary-fixed": "#9cf2e8",
                "on-tertiary-container": "#bef3ff",
                "outline": "#6e7977",
                "on-tertiary": "#ffffff",
                "on-error": "#ffffff",
                "surface-container-highest": "#d3e4fe",
                "on-primary-fixed": "#00201d",
                "on-secondary-fixed": "#00201c",
                "error-container": "#ffdad6",
                "primary-fixed-dim": "#80d5cb",
                "surface-container": "#e5eeff",
                "surface-dim": "#cbdbf5",
                "tertiary": "#005a66",
                "tertiary-fixed": "#a2eeff",
                "surface-tint": "#006a63",
                "on-primary-container": "#a3faef",
                "on-background": "#0b1c30",
                "on-tertiary-fixed-variant": "#004e5a",
                "on-error-container": "#93000a",
                "inverse-surface": "#213145",
                "on-tertiary-fixed": "#001f25",
                "primary-container": "#0f766e",
                "surface-container-low": "#eff4ff",
                "tertiary-container": "#007484",
                "secondary-fixed": "#71f8e4",
                "secondary-fixed-dim": "#4fdbc8"
            },
            "fontFamily": {
                "headline-md": ["Inter"],
                "label-md": ["Inter"],

                "display-lg": ["Inter"],

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 92, 85, 0.1);
        }
        .dark .glass-card {
            background: rgba(11, 28, 48, 0.7);
            border: 1px solid rgba(128, 213, 203, 0.1);
        }
        
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }
        .bg-pulse {
            animation: pulse-slow 8s ease-in-out infinite;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        .input-inset {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md transition-colors duration-300 overflow-hidden">
<!-- Background Atmospheric Elements -->
<div class="fixed inset-0 z-0 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/10 blur-[120px] bg-pulse"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-secondary/10 blur-[120px] bg-pulse" style="animation-delay: -4s;"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80%] h-[80%] opacity-20 dark:opacity-10">

</div>
</div>
<!-- Theme Toggle -->
<div class="fixed top-8 right-8 z-50">
<button class="p-2 rounded-full bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface shadow-sm" id="theme-toggle">
<span class="material-symbols-outlined dark:hidden">dark_mode</span>
<span class="material-symbols-outlined hidden dark:block">light_mode</span>
</button>
</div>
<!-- Main Container -->
<main class="relative z-10 min-h-screen flex items-center justify-center p-gutter">
<!-- Login Card -->
<div class="glass-card w-full max-w-[440px] rounded-xl p-10 shadow-2xl transition-all duration-500 hover:shadow-primary/5">
<!-- Branding -->
<div class="text-center mb-10">
<div class="flex items-center justify-center gap-3 mb-2">
<div class="w-10 h-10 rounded-lg bg-primary-container flex items-center justify-center text-primary-fixed">
<span class="material-symbols-outlined !text-[28px]" style="font-variation-settings: 'FILL' 1;">monitoring</span>
</div>
<h1 class="font-headline-md text-headline-md font-bold tracking-tight text-on-surface">API Pulse</h1>
</div>
<p class="text-on-surface-variant font-label-md text-label-md tracking-wider">INTELLIGENT API MONITORING</p>
</div>
<!-- Login Form -->
<form class="space-y-6" id="login-form">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-[20px]">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border border-outline-variant/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all input-inset font-body-md" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="password">Password</label>
<a class="text-primary font-label-md text-label-md hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-[20px]">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-surface-container-low border border-outline-variant/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all input-inset font-body-md" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-3 ml-1">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary cursor-pointer" id="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-on-surface-variant cursor-pointer select-none" for="remember">Remember this device</label>
</div>
<!-- Login Action -->
<button class="w-full bg-primary-container text-on-primary-container font-bold py-4 rounded-lg shadow-sm hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Login to Pulse</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-10 flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<span class="relative px-4 bg-transparent font-label-md text-label-md text-outline uppercase tracking-widest">Or continue with</span>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 py-3 px-4 border border-outline-variant/30 rounded-lg hover:bg-surface-container transition-colors group active:scale-95">
<img class="w-5 h-5 grayscale group-hover:grayscale-0 transition-all" data-alt="A clean, minimalist logo of Google on a white background, symbolizing modern technology and integration. Professional and crisp lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBKu5f5XlE9XZi_he3m8kkNoedidQh69_hxcL8dxTqS2gmg0BNf95yYP7cmaxUgZOX3Z_ewoKRIxx6l8wyyH3oO2ldmyKwck8DTOV63hl2r7nsEZu-o7oZqgQvC8ykd-yIxANBh_L6G6G5b8RV50mlMlvjBLqikJr3haIIAm6EcMr6LhiDNZjIEGbdPOHr1IKRV8D7H8th_YOUde_bsm3ymJNwUOabBRxbUm9709GCyI2itXmUk_wQBzdsc1NI5_fSfu0F6G5WRcg"/>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-3 py-3 px-4 border border-outline-variant/30 rounded-lg hover:bg-surface-container transition-colors group active:scale-95">
<span class="material-symbols-outlined text-[#0078d4] text-[20px] grayscale group-hover:grayscale-0">grid_view</span>
<span class="font-label-md text-label-md text-on-surface">Microsoft</span>
</button>
</div>
<!-- Footer Link -->
<p class="mt-8 text-center font-body-md text-body-md text-on-surface-variant">
                New to API Pulse? <a class="text-primary font-bold hover:underline" href="#">Create an account</a>
</p>
</div>
</main>
<script>
        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
        });

        // Password Visibility Logic
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.innerText = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Form Submission Intercept
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin material-symbols-outlined">progress_activity</span> Authenticating...`;
            
            // Simulate API Delay
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Success`;
                btn.classList.replace('bg-primary-container', 'bg-secondary');
                btn.classList.replace('text-on-primary-container', 'text-on-secondary');
                
                setTimeout(() => {
                    // Redirect simulation
                    console.log('Logging in...');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    btn.classList.replace('bg-secondary', 'bg-primary-container');
                    btn.classList.replace('text-on-secondary', 'text-on-primary-container');
                }, 1000);
            }, 2000);
        });
    </script>
</body></html>
